repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        args: [-x]
        language: system
        types: [shell]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -ci, --write]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.28.0
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: validate-marketplace
        name: validate marketplace plugins and skills
        entry: python3 -I .github/scripts/validate_plugins.py
        language: system
        pass_filenames: false
        files: ^(plugins/|\.claude-plugin/|CODEOWNERS|README\.md)

      - id: validator-self-test
        name: validator self-test
        entry: python3 -I .github/scripts/validate_plugins.py --self-test
        language: system
        pass_filenames: false
        files: ^(\.github/scripts/validate_plugins\.py|Makefile|\.pre-commit-config\.yaml)$
