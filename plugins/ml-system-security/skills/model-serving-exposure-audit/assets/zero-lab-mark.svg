        <g><rect x="-6" y="-7" width="2" height="2" fill="#eee"></rect>


        </g>

        <rect x="-3" y="-2" width="6" height="4" fill="#fff">

        </rect>
      </g>


      <g transform="translate(0, -27)">
        <g><rect x="20" y="-2" width="2" height="2" fill="#ddd"></rect>


        </g>
        <g><rect x="-16" y="4" width="2" height="2" fill="#ccc"></rect>


        </g>
        <g><rect x="6" y="-22" width="2" height="2" fill="#ddd"></rect>


        </g>
        <g><rect x="-25" y="-6" width="2" height="2" fill="#ccc"></rect>


