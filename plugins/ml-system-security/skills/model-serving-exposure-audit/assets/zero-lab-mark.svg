<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -27.5 200 280" width="200" height="280">
  <defs>

    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"></stop>
      <stop offset="100%" stop-color="#2d2d2d"></stop>
    </linearGradient>
    <linearGradient id="facet-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080808"></stop>
      <stop offset="100%" stop-color="#141414"></stop>
    </linearGradient>
    <linearGradient id="facet-top-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#383838"></stop>
      <stop offset="100%" stop-color="#4a4a4a"></stop>
    </linearGradient>
    <linearGradient id="facet-top-right" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1e1e"></stop>
      <stop offset="100%" stop-color="#303030"></stop>
    </linearGradient>

    <radialGradient id="rip-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"></stop>
      <stop offset="12%" stop-color="#ffffff" stop-opacity="0.8"></stop>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.4"></stop>
      <stop offset="55%" stop-color="#e8e8e8" stop-opacity="0.12"></stop>
      <stop offset="100%" stop-color="#999" stop-opacity="0"></stop>
    </radialGradient>

    <radialGradient id="rip-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"></stop>
      <stop offset="50%" stop-color="#ddd" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#999" stop-opacity="0"></stop>
    </radialGradient>

    <clipPath id="prism-clip">
      <polygon points="0,-130 -65,20 0,75 65,20"></polygon>
    </clipPath>

    <radialGradient id="corruption-fade" cx="100" cy="113" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"></stop>
      <stop offset="40%" stop-color="white" stop-opacity="0.8"></stop>
      <stop offset="70%" stop-color="white" stop-opacity="0.3"></stop>
      <stop offset="100%" stop-color="black"></stop>
    </radialGradient>
    <mask id="corruption-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="280">
      <rect x="0" y="0" width="200" height="280" fill="url(#corruption-fade)"></rect>
    </mask>

    <filter id="awakened-eye" x="-20%" y="-20%" width="140%" height="140%">

      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.06" numOctaves="4" seed="7" result="corruption">


      </feTurbulence>

      <feDisplacementMap in="SourceGraphic" in2="corruption" scale="6" xChannelSelector="R" yChannelSelector="G" result="warped"></feDisplacementMap>

      <feComponentTransfer in="warped" result="sharpened">
        <feFuncR type="linear" slope="1.3" intercept="-0.05"></feFuncR>
        <feFuncG type="linear" slope="1.3" intercept="-0.05"></feFuncG>
        <feFuncB type="linear" slope="1.3" intercept="-0.05"></feFuncB>
      </feComponentTransfer>

      <feTurbulence type="turbulence" baseFrequency="0.0 0.4" numOctaves="1" seed="42" result="scanlines">

      </feTurbulence>

      <feBlend in="sharpened" in2="scanlines" mode="multiply" result="dirty"></feBlend>

      <feBlend in="dirty" in2="SourceGraphic" mode="screen"></feBlend>
    </filter>
  </defs>

  <g transform="translate(100, 140)">


    <polygon points="0,75 -65,20 0,10" fill="url(#facet-left)" opacity="0.95"></polygon>

    <polygon points="0,75 65,20 0,10" fill="url(#facet-right)" opacity="0.95"></polygon>

    <polygon points="-65,20 0,-130 -30,-50" fill="url(#facet-top-left)" opacity="0.9"></polygon>

    <polygon points="65,20 0,-130 30,-50" fill="url(#facet-top-right)" opacity="0.9"></polygon>

    <polygon points="-30,-50 0,-130 0,-40" fill="#111" opacity="0.95"></polygon>

    <polygon points="30,-50 0,-130 0,-40" fill="#111" opacity="0.95"></polygon>

    <polygon points="-65,20 -30,-50 0,10" fill="#111" opacity="0.95"></polygon>

